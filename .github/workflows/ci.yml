name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Python Lint & Format Check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: uv tool install ruff

      - name: Ruff lint check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ──────────────────────────────────────────────
  # 2. Docker Build Verification (parallel matrix)
  # ──────────────────────────────────────────────
  docker-build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile
          - service: metrics_retriever
            dockerfile: packages/metrics_retriever/Dockerfile
          - service: feature_builder
            dockerfile: packages/feature_builder/Dockerfile
          - service: rule_engine
            dockerfile: packages/rule_engine/Dockerfile
          - service: recommendation-module
            dockerfile: packages/recommendation_module/backend/Dockerfile
          - service: rca_engine
            dockerfile: packages/rca_engine/Dockerfile
          - service: test_cycle_comparison
            dockerfile: packages/test_cycle_comparison/Dockerfile
          - service: k6_worker
            dockerfile: packages/k6_worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────
  # 3. Docker Compose Validation
  # ──────────────────────────────────────────────
  compose-validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
