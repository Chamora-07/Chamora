name: Backend CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/chamora-07/chamora

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Push Docker Images to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile
          - service: metrics-retriever
            dockerfile: packages/metrics_retriever/Dockerfile
          - service: feature-builder
            dockerfile: packages/feature_builder/Dockerfile
          - service: rule-engine
            dockerfile: packages/rule_engine/Dockerfile
          - service: recommendation-module
            dockerfile: packages/recommendation_module/backend/Dockerfile
          - service: rca-engine
            dockerfile: packages/rca_engine/Dockerfile
          - service: test-cycle-comparison
            dockerfile: packages/test_cycle_comparison/Dockerfile
          - service: k6-worker
            dockerfile: packages/k6_worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────
  # 2. Deploy to VPS via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare server directory
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          CLEAN_PATH=$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${CLEAN_PATH}"

      - name: Write .env file on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        run: |
          CLEAN_PATH=$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n')
          printf '%s' "$ENV_FILE_CONTENTS" > /tmp/chamora_deploy.env
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/chamora_deploy.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${CLEAN_PATH}/.env"
          rm -f /tmp/chamora_deploy.env

      - name: Copy production compose file to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          CLEAN_PATH=$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n')
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose-pd.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${CLEAN_PATH}/docker-compose.yml"

      - name: Pull images and restart services
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          CLEAN_PATH=$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash << ENDSSH
          set -e
          cd "${CLEAN_PATH}"
          echo "Pulling public images from GHCR (no auth needed)..."
          docker compose pull 2>/dev/null || true
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
