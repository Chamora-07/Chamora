[project]
name = "feature-builder"
version = "0.1.0"
description = "Stateful Feature Engineering Service for Chamora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4.0",
    "pydantic-settings>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_builder"]