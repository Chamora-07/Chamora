[project]
name = "metrics-retriever"
version = "0.1.0"
description = "Internal metrics scraper and Kafka producer"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.14.0",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "uvicorn>=0.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["metrics_retriever"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"