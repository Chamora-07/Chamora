[project]
name = "rule-engine"
version = "0.1.0"
description = "Real-time anomaly detection engine for Project Chamora"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.4.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",         # Required for Supabase async connection
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
]

[tool.hatch.build.targets.wheel]
packages = ["rule_engine"]