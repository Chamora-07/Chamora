services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - anomaly_detection
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    networks:
      - anomaly_detection
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://13.49.183.64:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "kafka:29092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    volumes:
      - kafka-data:/var/lib/kafka/data

    restart: unless-stopped

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    networks:
      - anomaly_detection
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  metrics_retriever:
    image: ghcr.io/chamora-07/chamora/metrics-retriever:latest
    container_name: metrics_retriever
    depends_on:
      - kafka
    networks:
      - anomaly_detection
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/metrics_retriever
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: ${DATABASE_URL}
    restart: always

  backend:
    image: ghcr.io/chamora-07/chamora/backend:latest
    container_name: chamora_backend
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - anomaly_detection
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  feature_builder:
    image: ghcr.io/chamora-07/chamora/feature-builder:latest
    container_name: feature_builder
    depends_on:
      - kafka
      - metrics_retriever
    networks:
      - anomaly_detection
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/feature_builder
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: raw_metrics
      KAFKA_FEATURE_TOPIC: processed_features
    restart: always

  rule_engine:
    image: ghcr.io/chamora-07/chamora/rule-engine:latest
    container_name: rule_engine
    depends_on:
      - kafka
      - feature_builder
    networks:
      - anomaly_detection
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/packages/rule_engine
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_FEATURES: processed_features
      KAFKA_CONSUMER_GROUP: chamora-rule-engine-v1
      DATABASE_URL: ${DATABASE_URL}
    restart: always

  recommendation-module:
    image: ghcr.io/chamora-07/chamora/recommendation-module:latest
    container_name: recommendation-module
    ports:
      - "8010:8000"
    env_file:
      - .env
    networks:
      - anomaly_detection
    restart: unless-stopped

  test_cycle_comparison:
    image: ghcr.io/chamora-07/chamora/test-cycle-comparison:latest
    container_name: test_cycle_comparison
    ports:
      - "8030:8000"
    env_file:
      - .env
    networks:
      - anomaly_detection
    restart: unless-stopped

  rca_engine:
    image: ghcr.io/chamora-07/chamora/rca-engine:latest
    container_name: rca_engine
    ports:
      - "8020:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: '["*"]'
    networks:
      - anomaly_detection
    restart: unless-stopped

  k6_worker:
    image: ghcr.io/chamora-07/chamora/k6-worker:latest
    container_name: k6_worker
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - anomaly_detection
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

networks:
  anomaly_detection:
    driver: bridge

volumes:
  kafka-data:
