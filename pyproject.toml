[project]
name = "chamora"
version = "0.1.0"
description = "Performance Engine Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
# Only keep global dependencies here, or leave empty if apps handle their own
dependencies = [
    "asyncpg>=0.31.0",
    "metrics_retriever",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "supabase>=2.28.3",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
metrics_retriever = { workspace = true }
